[defaults]
# (boolean) By default, Ansible will issue a warning when received from a task action (module or action plugin).
# These warnings can be silenced by adjusting this setting to False.
action_warnings=False

#(pathlist) Comma-separated list of Ansible inventory sources
#inventory=./inventory.ini
inventory=./inventory.yaml

#Option for connections using a certificate or key file to authenticate, 
#rather than an agent or passwords, 
#you can set the default value here to avoid re-specifying --private-key with every invocation.
private_key_file=../master_key/ansible_key2


#Set this to “False” if you want to avoid host key checking 
host_key_checking=False


#Enable log collection  environment var -> $ANSIBLE_LOG_PATH or log_path parameter
#log_path=./ansible_mylogs.log
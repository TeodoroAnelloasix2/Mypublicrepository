---
- name: Test basic loop
  hosts: mysql
  
  tasks:
  - name: Get item across loop
    ansible.builtin.debug:
      msg: "{{item}}" # item is a keyword ans it is generated by loop 
    loop:
      - value1
      - value2
      - value3
  
  - name: Create groups
    become: true
    become_user: root
    ansible.builtin.group:
      name: "{{item}}"
      state: present
    loop:
      - group1
      - group2
      - group3
  - name: Create groups 2
    become: true
    become_user: root
    vars:
      my_groups:
        - group4
        - group5
    ansible.builtin.group:
      name: "{{item}}"
      state: present
    loop: "{{my_groups}}"


apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: managed-ng-cluster
  region: us-east-1

managedNodeGroups: # Nodegroups managed by aws
  - name: managed-ng-1
    instanceType: t3.small
    minSize: 2
    maxSize: 5

nodeGroups: # Nodegroups magaged by our self
  - name: our-self-ng-2
    instanceType: t3.small
    desiredCapacity: 2
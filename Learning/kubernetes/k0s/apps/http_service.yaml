apiVersion: v1 
kind: Pod

metadata:
  name: k0s-web3
  labels:
    app: k0s-web3

spec:
  containers:
    - name: k0s-front1
      image: httpd:latest
      ports:
        - containerPort: 80
    
    - name: k0s-back1
      image: ubuntu:latest
      command: ["/bin/bash"]
      args: ["-c","while true; do echo 'hello' && sleep 10;done"]
---
apiVersion: v1 
kind: Service

metadata:
  name: k0s-service1

spec:
  type: NodePort
  selector:
    app: k0s-web3
  ports:
    - protocol: TCP 
      port: 80
      targetPort: 80 # App port



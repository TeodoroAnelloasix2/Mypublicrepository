apiVersion: v1 
kind: Service
metadata:
  name: k0s-nginx1-service
  labels:
    app: k0s-nginx

spec:
  ports:
  - port: 80
    name: k0s-nginx1-service
  clusterIP: None
  selector:
    app: k0s-nginx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-statefulset
  labels:
    app: k0s-nginx

spec:
  serviceName: k0s-nginx1-service
  replicas: 3
  selector:
    matchLabels:
      app: k0s-nginx
  template:
    metadata:
      labels:
        app: k0s-nginx
    spec:
      containers:
      - name: k0s-nginx-ctn1
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-external-service
  labels:
    app: k0s-nginx
spec:
  type: NodePort 
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30517  # Specify port
  selector:
    app: k0s-nginx
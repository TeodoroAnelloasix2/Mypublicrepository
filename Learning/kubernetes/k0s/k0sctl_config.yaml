apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: my-k0s-cluster
  user: admin
spec:
  hosts:
  - role: controller+worker
    installFlags:
    - --debug
    ssh:
      address: 10.0.2.51
      user: ec2-user
      port: 22
      keyPath: "path/to/key/k0s_key.pem"
      bastion:
        address: public_ip_bastion_host
        user: ec2-user
        keyPath: "path/to/key/k0s_key.pem"
  - role: worker
    installFlags:
    - --debug
    ssh:
      address: 10.0.2.184
      user: ec2-user
      port: 22
      keyPath: "path/to/key/k0s_key.pem"
      bastion:
        address: public_ip_bastion_host
        user: ec2-user
        keyPath: "path/to/key/k0s_key.pem"

  k0s:
    version: 1.21.1+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: my-k0s-cluster
      spec:
        images:
          calico:
            cni:
              image: calico/cni
              version: v3.16.2
  options:
    wait:
      enabled: true
    drain:
      enabled: true
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
    concurrency:
      limit: 30
      uploads: 5

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-1
  labels:
    app: simple-nginx-app
    maintainer: italianodevops
    env: prod
    tier: front
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simple-nginx-app
      env: prod
  template:
    metadata:
      labels:
        app: simple-nginx-app
        env: prod
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-1
  labels:
    app: simple-nginx-app
    env: prod
    maintainer: italianodevops
spec:
  type: NodePort
  selector:
    app: simple-nginx-app
    env: prod
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30517
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
            - name: MYSQL_DATABASE
              value: appdb
            - name: MYSQL_USER
              value: appuser
            - name: MYSQL_PASSWORD
              value: apppass
                    

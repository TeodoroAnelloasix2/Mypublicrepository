apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-1
  labels:
    app: simple-nginx-app
    maintainer: italianodevops
    env: prod
    tier: front
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simple-nginx-app
      env: prod
  template:
    metadata:
      labels:
        app: simple-nginx-app
        env: prod
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1 
kind: Service
metadata:
  name: nginx-svc-loadbalancer
spec:
  type: LoadBalancer
  selector: # Select pods labels to expose them
    app: simple-nginx-app
    env: prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
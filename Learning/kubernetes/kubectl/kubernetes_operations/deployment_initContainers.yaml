apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-1
  labels:
    app: simple-nginx-app
    maintainer: italianodevops
    env: prod
    tier: front
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simple-nginx-app
      env: prod
  template:
    metadata:
      labels:
        app: simple-nginx-app
        env: prod
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: workdir
              mountPath: /usr/share/nginx/html
      initContainers: # These containers run before main pod, usefull to build previous resources
        - name: install
          image: busybox
          command: ["wget","-o","/work-dir/index.html","https://checkip.amazonaws.com"] # Get public ip
          volumeMounts:
            - name: workdir
              mountPath: /work-dir 
      volumes:
      - name: workdir
        emptyDir: {}